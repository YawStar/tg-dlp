name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Release တင်ဖို့အတွက် လိုအပ်

jobs:
  release:
    name: Build & Upload Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser အတွက် Git history လိုအပ်

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # ==========================================
      # အဆင့် ၁ - GoReleaser နဲ့ ဖိုင်တွေကို Local အတွင်း (dist folder) မှာ ထုတ်မယ်
      # ==========================================
      - name: Run GoReleaser (Build Only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # --skip=publish ကို သုံးပြီး GitHub Releases မှာ တင်တာကို ပိတ်ထား
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # အဆင့် ၂ - ထွက်လာတဲ့ ဖိုင်တွေကို GitHub Actions Artifacts မှာ တင်မယ်
      # ==========================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-dlp-binaries
          path: dist/*
          retention-days: 14 # ရက် ၁၄ ရက်အထိ သိမ်းထားမယ် (ကြိုက်သလို ပြောင်းနိုင်တယ်)
          if-no-files-found: error

      # ==========================================
      # အဆင့် ၃ - GitHub Releases မှာ တင်
      # ==========================================
      # - name: Publish to GitHub Releases
      #   uses: goreleaser/goreleaser-action@v6
      #   with:
      #     distribution: goreleaser
      #     version: '~> v2'
      #     args: release --clean
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
