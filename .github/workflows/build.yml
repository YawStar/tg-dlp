name: Build Artifacts

on:
  workflow_dispatch: # Manual Run လုပ်ဖို့ပဲ သတ်မှတ်ထား

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: tg-dlp_linux_amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: tg-dlp_linux_arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: tg-dlp_windows_x64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: tg-dlp_macOS_amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: tg-dlp_macOS_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.output }} .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
