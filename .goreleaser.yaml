version: 2

project_name: tg-dlp

before:
  hooks:
    - go mod tidy

builds:
  - id: tg-dlp
    main: .
    binary: tg-dlp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "5"
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w
      - -X tg-dlp/pkg/runtime.Version={{.Version}}
      - -X tg-dlp/pkg/runtime.Commit={{.FullCommit}}
      - -X tg-dlp/pkg/runtime.BuildTime={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Os "windows" }}
        {{- if eq .Arch "amd64" }}x64
        {{- else if eq .Arch "386" }}x86
        {{- else }}{{ .Arch }}{{ end }}
      {{- else }}
        {{- if eq .Arch "amd64" }}amd64
        {{- else if eq .Arch "386" }}i386
        {{- else }}{{ .Arch }}{{ end }}
      {{- end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - README_my.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'

release:
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Tag}}"